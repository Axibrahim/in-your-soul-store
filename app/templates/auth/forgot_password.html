{% extends 'base.html' %}
{% block title %}Reset Password — IN YOUR SOUL{% endblock %}

{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="form-logo">
      <svg width="260" height="30" viewBox="0 0 260 30" fill="none">
        <text x="0" y="24" font-family="Space Mono" font-weight="700" font-size="24" fill="#76ff03" letter-spacing="4">#IN YOUR SOUL</text>
      </svg>
    </div>
    <div class="form-title">RESET PASSWORD</div>

    <p style="text-align:center; color:var(--text-dim); font-size:0.85rem; line-height:1.6; margin:-0.4rem 0 1.5rem;">
      Enter your verified account email and we will send you a reset link.
    </p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="field">
        <label>EMAIL</label>
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
      </div>

      <button type="submit" class="btn btn--primary btn--full">
        <span>Send Reset Link</span>
      </button>
    </form>

    <div class="form-divider">OR</div>

    <a href="{{ url_for('auth.login') }}" class="btn btn--ghost btn--full">
      <span>Back to Login</span>
    </a>
  </div>
</div>
{% endblock %}
