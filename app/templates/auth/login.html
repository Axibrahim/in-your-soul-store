{% extends 'base.html' %}
{% block title %}Login — FREKS{% endblock %}

{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="form-logo">
      <svg width="260" height="30" viewBox="0 0 260 30" fill="none">
        <text x="0" y="24" font-family="Space Mono" font-weight="700" font-size="24" fill="#76ff03" letter-spacing="4">#IN YOUR SOUL</text>
      </svg>
    </div>
    <div class="form-title">Welcome Back MR...?</div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="Email" required autocomplete="email"/>
      </div>

      <div class="field">
        <label>PASSWORD</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>

      <div class="check-field remember-toggle">
        <label class="toggle-switch">
          <input type="checkbox" name="remember" id="remember"/>
          <span class="toggle-track">
            <span class="toggle-knob"></span>
          </span>
          <canvas class="toggle-fx" id="remember-fx"></canvas>
        </label>
        <label for="remember" class="toggle-text">Keep me logged in</label>
      </div>

      <div style="text-align:right; margin:-0.4rem 0 1rem;">
        <a href="{{ url_for('auth.forgot_password') }}" style="color:var(--accent); font-size:0.8rem;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn--primary btn--full">
        <span>Login</span>
      </button>
    </form>

    <div class="form-divider">OR</div>

    <a href="{{ url_for('auth.guest_checkout', next=request.args.get('next', '')) }}" class="btn btn--full" style="text-align:center; margin-bottom:1rem;">
      <span>CONTINUE AS GUEST →</span>
    </a>

    <div style="text-align:center; font-size:0.85rem; color:var(--text-dim);">
      New to IN YOUR SOUL?
      <a href="{{ url_for('auth.register') }}" style="color:var(--accent); margin-left:0.35rem;">Create Account →</a>
    </div>
  </div>
</div>
{% endblock %}
